let mode='quiz',section='all',length=10,round=null,storageOK=true,persist=true;
let progress={quiz:{},write:{},cards:{}};
function cleanRecords(input){const out={};if(!input||typeof input!=='object'||Array.isArray(input))return out;for(const w of WORDS){const r=input[w.id];if(r&&Number.isInteger(r.seen)&&r.seen>=0&&Number.isInteger(r.streak)&&r.streak>=0&&typeof r.difficult==='boolean')out[w.id]={seen:r.seen,streak:r.streak,difficult:r.difficult};}return out;}
function loadProgress(){let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||'null');if(!saved){const old=JSON.parse(localStorage.getItem(LEGACY_KEY)||'{}');saved={quiz:old,write:{},cards:{}};}}catch(e){storageOK=false;}return {quiz:cleanRecords(saved?.quiz),write:cleanRecords(saved?.write),cards:cleanRecords(saved?.cards)};}
try{persist=localStorage.getItem(PREF_KEY)!=='false';if(persist)progress=loadProgress();}catch(e){storageOK=false;}
function activeRecords(){return progress[mode];}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function pool(){return section==='all'?MAIN:WORDS.filter(w=>section==='Sätze'?w.s==='Sätze':w.s.split(' / ').includes(section));}
function difficult(){return WORDS.filter(w=>activeRecords()[w.id]?.difficult);}
function stats(){const records=activeRecords();return {known:MAIN.filter(w=>(records[w.id]?.streak||0)>=2).length,work:MAIN.filter(w=>(records[w.id]?.seen||0)>0&&(records[w.id]?.streak||0)<2).length,open:MAIN.filter(w=>!records[w.id]?.seen).length};}
function save(){if(!persist)return;try{localStorage.setItem(KEY,JSON.stringify(progress));}catch(e){storageOK=false;}}
function record(w,right){const records=activeRecords(),r=records[w.id]||{seen:0,streak:0,difficult:false};r.seen++;r.streak=right?r.streak+1:0;if(!right)r.difficult=true;else if(r.streak>=2)r.difficult=false;records[w.id]=r;save();}
function setPersistence(enabled){persist=enabled;progress=enabled?loadProgress():{quiz:{},write:{},cards:{}};try{localStorage.setItem(PREF_KEY,String(enabled));}catch(e){storageOK=false;}renderHome();}
function resetProgress(){if(!confirm('Alle gespeicherten Lernstände für beide Levels und die Lernkarten löschen und neu anfangen?'))return;progress={quiz:{},write:{},cards:{}};try{localStorage.removeItem(KEY);localStorage.removeItem(LEGACY_KEY);}catch(e){storageOK=false;}round=null;nav('#start');}
function notice(){return storageOK?'':'<div class="notice" role="status">Dein Browser erlaubt gerade kein Speichern. Du kannst spielen; dein Lernstand bleibt nur bis zum Schließen oder Neuladen dieser Seite erhalten.</div>';}
function nav(hash){if(location.hash===hash)render();else location.hash=hash;}
function home(){round=null;nav('#start');}
function renderHome(){const st=stats(),n=difficult().length;app.innerHTML=`${notice()}<section class="hero"><div><p class="eyebrow">Dein Vokabeltraining</p><h1>Kleine Runde.<br>Große Fortschritte.</h1><p class="lead">Erst Englisch. Dann du. Übe die Wörter aus Theme 2 – in deinem Tempo, eine Vokabel nach der anderen.</p></div><span class="hero-tag">Seiten 198–200 · ${MAIN.length} Vokabeln</span></section><section class="memory-bar" aria-label="Lernstand und Neustart"><div><label class="memory-label"><input id="save-progress" type="checkbox" ${persist?'checked':''}>Lernstand speichern</label><p class="memory-note">${persist?'Speichern ist an. Dein Lernstand bleibt beim nächsten Besuch erhalten.':'Ohne Speichern: Nach dem Neuladen startest du bei null. Frühere gespeicherte Lernstände bleiben erhalten, bis du sie löschst.'}</p></div><button class="reset-btn" data-action="reset">Neu anfangen · Lernstand löschen</button></section><p class="level-progress">Lernstand für <strong>${modeLabels[mode]}</strong>${persist?'':' · nur für diese Sitzung'}. Jeder Level zählt für sich.</p><section class="stats" aria-label="Dein Lernstand für die Vokabeln"><div class="stat good"><div class="stat-number">${st.known}</div><div class="stat-label">Schon sicher</div></div><div class="stat work"><div class="stat-number">${st.work}</div><div class="stat-label">Noch im Training</div></div><div class="stat"><div class="stat-number">${st.open}</div><div class="stat-label">Noch entdecken</div></div></section><div class="layout"><section class="panel"><div class="panel-head"><div><h2>Deine nächste Runde</h2><p class="hint" style="margin-top:0">Wähle aus und leg los.</p></div><span class="step-no">LET’S GO</span></div><fieldset class="field"><legend>1 · Welchen Level möchtest du üben?</legend><div class="mode-grid"><button class="choice" data-mode="quiz" aria-pressed="${mode==='quiz'}"><span class="level-tag">Level 1 · Mit Hilfe</span><strong>Bedeutung anklicken</strong><small>Englisch sehen. Aus vier Antworten wählen.</small></button><button class="choice" data-mode="write" aria-pressed="${mode==='write'}"><span class="level-tag">Level 2 · Ohne Vorgaben</span><strong>Selbst schreiben</strong><small>Englisch sehen. Deutsche Bedeutung eintippen.</small></button></div><button class="choice cards-option" data-mode="cards" aria-pressed="${mode==='cards'}"><strong>Lernkarten</strong><small>Zum Lernen: überlegen, aufdecken, selbst einschätzen.</small></button></fieldset><fieldset class="field"><legend>2 · Welche Wörter sind dran?</legend><div class="chips">${Object.entries(sectionLabels).map(([k,v])=>`<button class="chip" data-section="${k}" aria-pressed="${section===k}">${v}</button>`).join('')}</div><p class="hint" id="pool-note">${pool().length} Einträge in dieser Auswahl. ${section==='Sätze'?'Freiwilliger Zusatz: die Arbeitsaufträge aus den Kästen.':'„Alle Vokabeln“ enthält die Wörter und Wendungen ohne Arbeitsaufträge.'}</p></fieldset><fieldset class="field"><legend>3 · Wie lang ist deine Runde?</legend><div class="chips">${[10,20,'all'].map(n=>`<button class="chip" data-length="${n}" aria-pressed="${length===n}">${n==='all'?'Alle':n+' Wörter'}</button>`).join('')}</div><p class="hint">Kleine Auswahl? Dann kommen alle gewählten Einträge dran.</p></fieldset><button class="primary wide" data-action="start"><span>Runde starten</span><span aria-hidden="true">→</span></button></section><aside><section class="panel side"><p class="eyebrow">So einfach geht’s</p><h2>Englisch sehen.<br>Bedeutung finden.</h2><p>Keine Bilder, die etwas verraten. Hier zählen deine Wörter.</p><ol class="mini-steps"><li><span>1</span>Sieh dir das englische Wort an.</li><li><span>2</span>Wähle oder schreibe die Bedeutung. Bei Lernkarten: aufdecken.</li><li><span>3</span>Übe schwierige Wörter noch einmal.</li></ol></section><section class="panel review-box"><h3>Noch einmal üben</h3><p>${n?n+' schwierige '+(n===1?'Vokabel wartet':'Vokabeln warten')+' in diesem Level auf dich. Nach zwei richtigen Antworten hintereinander wird ein Wort als sicher gezählt.':'Hier sammeln sich die schwierigen Wörter des gewählten Levels. Nach zwei richtigen Antworten hintereinander gilt ein Wort als sicher.'}</p><button class="secondary" data-action="review" ${n?'':'disabled'}>${n?'Schwierige Wörter üben':'Noch keine schwierigen Wörter'}</button></section></aside></div><details class="catalog"><summary>Wortschatz nachschlagen · ${MAIN.length} Vokabeln + ${WORDS.length-MAIN.length} Arbeitsaufträge</summary><div class="catalog-content"><p class="catalog-note">Aus deinen drei Fotos übertragen. „past“ steht im Buch zweimal und wird hier einmal geführt. Bei „tooth“ und „foot“ ist die Mehrzahl enthalten. Arbeitsaufträge sind separat wählbar; abgeschnittene deutsche Texte wurden sinngemäß vervollständigt.</p><label class="sr-only" for="search">Englisches oder deutsches Wort suchen</label><input id="search" class="search" type="search" placeholder="Englisches oder deutsches Wort suchen …" autocomplete="off"><div class="word-list" id="word-list">${listWords(WORDS)}</div></div></details><footer class="footer"><p>${persist?'Dein Lernstand bleibt in diesem Browser auf diesem Gerät.':'Der aktuelle Lernstand wird nicht gespeichert.'} „Schon sicher“ bedeutet: zweimal hintereinander richtig im gewählten Level. Bei Lernkarten zählt deine eigene Einschätzung.</p><button class="text-btn" data-action="reset">Lernstand löschen</button></footer>`;}
function listWords(items){return items.length?items.map(w=>`<div class="word-row"><span class="word-en" lang="en">${esc(w.en)}</span><span class="word-de">${esc(w.de)}</span><span class="badge">${esc(w.s)} · S. ${w.p}</span></div>`).join(''):'<p class="empty">Kein passender Eintrag gefunden.</p>';}
function choicesFor(w){const source=WORDS.filter(x=>(x.s==='Sätze')===(w.s==='Sätze'));const seen=new Set([w.de]);const others=[];for(const x of shuffle(source)){if(!seen.has(x.de)){seen.add(x.de);others.push(x);if(others.length===3)break;}}return shuffle([w,...others]);}
function start(items=pool(),isReview=false){if(!items.length)return;const count=length==='all'?items.length:Math.min(length,items.length);round={mode,manual:0,items:shuffle(items).slice(0,count),index:0,right:0,missed:[],locked:false,revealed:false,options:null,review:isReview};nav('#spielen');}
function current(){return round.items[round.index];}
function play(){if(!round)return home();const w=current();if(round.mode==='quiz'&&!round.options)round.options=choicesFor(w);const total=round.items.length;
const controls=round.mode==='quiz'?`<div class="answers">${round.options.map((x,i)=>`<button class="answer" data-answer="${i}"><span class="answer-key" aria-hidden="true">${i+1}</span><span>${esc(x.de)}</span></button>`).join('')}</div>`:round.mode==='write'?`<form id="write-form" class="write-form"><label class="write-label" for="written-answer">Deine deutsche Übersetzung</label><input class="write-input" id="written-answer" name="answer" type="text" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="Bedeutung eingeben …" aria-describedby="writing-hint"><p class="writing-hint" id="writing-hint">Eine passende Übersetzung reicht. Groß- und Kleinschreibung sowie Satzzeichen spielen keine Rolle.</p><div class="write-controls"><button class="primary" id="check-answer" type="submit">Antwort prüfen</button><button class="secondary" type="button" data-action="skip-write">Weiß ich noch nicht</button></div></form>`:`<button class="primary" id="reveal" data-action="reveal">Lösung aufdecken</button><div id="card-back" hidden><div class="card-solution">${esc(w.de)}</div><p class="hint">Sei ehrlich zu dir: Konntest du die Bedeutung vorher schon?</p><div class="self-buttons"><button class="secondary" data-self="false">Noch üben</button><button class="primary" data-self="true">Gewusst ✓</button></div></div>`;
app.innerHTML=`${notice()}<section class="play-wrap"><div class="play-top"><button class="back" data-action="home">← Zur Übersicht</button><span class="play-label">${modeLabels[round.mode]}${round.review?' · Wiederholung':''}</span></div><div class="progress" role="progressbar" aria-label="Fortschritt der Runde" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${round.index}"><div class="progress-fill" style="width:${round.index/total*100}%"></div></div><div class="progress-info"><span>Wort ${round.index+1} von ${total}</span><span>${round.right} ${round.mode==='cards'?'gewusst':'richtig'}</span></div><section class="panel question-panel" aria-labelledby="question"><div class="question-meta">${w.s==='Sätze'?'Sätze & Arbeitsaufträge':'Theme 2 · '+esc(w.s)} · Seite ${w.p}</div><h1 class="question-word ${w.en.length>27?'long':''}" id="question" lang="en" tabindex="-1">${esc(w.en)}</h1><p class="question-prompt">${round.mode==='quiz'?'Welche deutsche Bedeutung passt?':round.mode==='write'?'Schreibe die Bedeutung auf Deutsch.':'Weißt du, was das auf Deutsch heißt? Überlege zuerst.'}</p>${controls}<div id="feedback" role="status" aria-live="polite"></div><button class="primary next" data-action="next" hidden>${round.index+1===total?'Runde abschließen':'Nächstes Wort →'}</button></section><p class="hint" style="text-align:center;margin-top:17px">${persist?'':'Ohne Speichern · '}${round.mode==='cards'?'Du entscheidest selbst, welche Wörter du noch üben möchtest.':'Erst in Ruhe überlegen. Du hast so viel Zeit, wie du brauchst.'}</p></section>`;document.getElementById('question')?.focus({preventScroll:true});}
function answer(index){if(!round||round.mode!=='quiz'||round.locked)return;const chosen=round.options[index];if(!chosen)return;round.locked=true;const w=current(),right=chosen.id===w.id;settle(right);const buttons=[...app.querySelectorAll('[data-answer]')];buttons.forEach((b,i)=>{b.disabled=true;if(round.options[i].id===w.id){b.classList.add('correct');b.querySelector('.answer-key').textContent='✓';}else if(i===index){b.classList.add('wrong');b.querySelector('.answer-key').textContent='×';}});const fb=document.getElementById('feedback');fb.className='feedback'+(right?'':' wrong');fb.innerHTML=`<strong>${right?'Richtig, gut gemacht!':'Noch nicht ganz – merk dir dieses Wort:'}</strong><span lang="en">${esc(w.en)}</span> = ${esc(w.de)}${!storageOK?'<div class="hint">Der Lernstand kann gerade nur für diese Sitzung behalten werden.</div>':''}`;const next=app.querySelector('[data-action="next"]');next.hidden=false;next.focus({preventScroll:true});}
// Bekannte alternative Übersetzungen. Es findet keine unscharfe Wortähnlichkeitswertung statt.
const ALIASES={
 'fresh':['frisch','neu'], 'start':['Anfang','Beginn','Start'],
 'wash':['waschen','sich waschen'], 'neck':['Hals','Nacken'], 'hair':['Haar','Haare'],
 'brush one’s teeth':['sich die Zähne putzen','die Zähne putzen','Zähne putzen','sich Zähne putzen'],
 'brush':['putzen','bürsten'], 'tooth (plural: teeth)':['Zahn'], 'foot (plural: feet)':['Fuß'],
 'chest':['Brustkorb','Brust'], 'hurry (up)':['sich beeilen','beeilen'],
 'Don’t forget …!':['Vergiss nicht','Vergesst nicht'], 'dirty':['dreckig','schmutzig'],
 'sea':['Meer','See'], 'late':['spät','zu spät'], 'just':['nur','bloß'],
 'still':['noch','immer noch'], 'haven’t got':['habe nicht','haben nicht','ich habe nicht','wir haben nicht'],
 'good-looking':['gut aussehend','gutaussehend','gut aussehen','sieht gut aus'],
 'guy':['Kerl','Typ'], 'tall':['groß','groß gewachsen'], 'strong':['stark','kräftig'],
 'Mr':['Herr','Herr Anrede'], 'grandpa':['Opa','Großvater'], 'bath':['Badewanne','Wanne'],
 'glasses':['Brille'], 'freckle':['Sommersprosse'], 'average':['durchschnittlich','durchschnitt'],
 'It’s half past eight.':['Es ist halb neun','halb neun','8:30','8.30','acht Uhr dreißig','Es ist acht Uhr dreißig'],
 'you’ve got (= you have got)':['du hast','ihr habt'], 'only':['nur','bloß'],
 'I don’t like …':['Ich mag nicht','Ich mag das nicht','Ich mag es nicht'],
 'every':['jede','jeder','jedes'],
 'I wish it was Sunday!':['Ich wünschte es wäre Sonntag','Ich wünsche mir es wäre Sonntag','Ich wünschte es sei Sonntag'],
 'dad':['Papa','Vati','Vater'],
 'Listen to the song and act it out.':['Hör dir das Lied an und spiele es nach','Höre das Lied und spiele es nach'],
 'Look at the comic.':['Schau dir den Comic an','Sieh den Comic an','Schau den Comic an'],
 'Look at the pictures.':['Schau dir die Bilder an','Sieh die Bilder an','Schau die Bilder an'],
 'Talk about David’s morning.':['Erzähle von Davids Morgen','Erzähle über Davids Morgen'],
 'Act out the scene.':['Spiele die Szene nach','Spielt die Szene nach'],
 'What does David see in the mirror?':['Was sieht David im Spiegel'],
 'What happens to her?':['Was passiert mit ihr','Was geschieht mit ihr','Was geschieht ihr'],
 'Who is who?':['Wer ist wer'],
 'Look at page … for help.':['Sieh dir zur Hilfe Seite an','Schau dir zur Hilfe Seite an','Schau auf Seite nach'],
 'Describe yourself like this.':['Beschreibe dich so','Beschreibe dich auf diese Weise'],
 'What does David have for breakfast today?':['Was frühstückt David heute','Was hat David heute zum Frühstück']
};
function normalizeAnswer(value){return value.normalize('NFKC').toLocaleLowerCase('de').replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').replace(/[’'"„“.,!?;…()\/\-–—]/g,' ').replace(/\s+/g,' ').trim().replace(/^(der|die|das|ein|eine|einen|einem|einer|eines|den|dem|des)\s+/,'');}
function acceptedAnswers(w){const plain=w.de.replace(/\([^)]*\)/g,'').trim(),alternatives=ALIASES[w.en]||(w.s==='Sätze'?[]:plain.split(/[,;\/]/));return new Set([w.de,plain,...alternatives].map(normalizeAnswer).filter(Boolean));}
function isAccepted(w,value){const v=normalizeAnswer(value);return !!v&&acceptedAnswers(w).has(v);}
function checkWritten(skipped=false){if(!round||round.mode!=='write'||round.locked)return;const input=document.getElementById('written-answer'),value=input.value.trim();const fb=document.getElementById('feedback');if(!value&&!skipped){fb.className='feedback';fb.textContent='Schreibe eine Bedeutung oder wähle „Weiß ich noch nicht“.';input.focus({preventScroll:true});return;}
const w=current(),right=!skipped&&isAccepted(w,value);round.locked=true;round.writeRight=right;round.skipped=skipped;const old=activeRecords()[w.id];round.beforeRecord=old?{...old}:null;settle(right);input.disabled=true;document.getElementById('check-answer').disabled=true;app.querySelector('[data-action="skip-write"]').disabled=true;
fb.className='feedback'+(right?'':' wrong');fb.innerHTML=`<strong>${right?'Richtig, gut gemacht!':skipped?'Dieses Wort üben wir noch einmal.':'Nicht automatisch erkannt – vergleiche deine Antwort.'}</strong>${value?`Deine Antwort: ${esc(value)}<br>`:''}<span lang="en">${esc(w.en)}</span> = ${esc(w.de)}${!right&&!skipped?'<br><button class="manual-answer" data-action="accept-written">Meine Übersetzung passt auch · als richtig werten</button>':''}`;
const button=app.querySelector('[data-action="next"]');button.hidden=false;button.focus({preventScroll:true});}
function acceptWritten(){if(!round||round.mode!=='write'||!round.locked||round.writeRight||round.skipped)return;const w=current();if(round.beforeRecord)activeRecords()[w.id]={...round.beforeRecord};else delete activeRecords()[w.id];round.missed=round.missed.filter(x=>x.id!==w.id);round.right++;round.manual++;round.writeRight=true;record(w,true);const fb=document.getElementById('feedback');fb.className='feedback';fb.innerHTML=`<strong>Von dir als passend gewertet.</strong>Vergleiche die Bedeutung sorgfältig: <span lang="en">${esc(w.en)}</span> = ${esc(w.de)}`;app.querySelector('[data-action="next"]').focus({preventScroll:true});}

function settle(right){const w=current();if(right)round.right++;else round.missed.push(w);record(w,right);}
function reveal(){if(!round||round.mode!=='cards'||round.revealed)return;round.revealed=true;document.getElementById('reveal').hidden=true;document.getElementById('card-back').hidden=false;app.querySelector('[data-self]')?.focus({preventScroll:true});}
function selfAnswer(right){if(!round||round.mode!=='cards'||!round.revealed||round.locked)return;round.locked=true;settle(right);next();}
function next(){if(!round||!round.locked)return;round.index++;if(round.index>=round.items.length){nav('#ergebnis');}else{round.locked=false;round.revealed=false;round.options=null;play();}window.scrollTo({top:0,behavior:'instant'});}
function result(){if(!round||round.index<round.items.length)return home();const n=round.items.length,bad=round.missed.length;app.innerHTML=`${notice()}<section class="play-wrap"><section class="panel result"><p class="eyebrow">${modeLabels[round.mode]} · Runde geschafft</p><div class="result-circle" aria-label="${round.right} von ${n}">${round.right}/${n}</div><h1 tabindex="-1" id="result-title">${bad?'Jede Runde bringt dich weiter.':'Das hast du richtig gut gemacht!'}</h1><p class="lead">${round.mode==='cards'?`Du hast bei ${round.right} von ${n} Karten „Gewusst“ gewählt.`:`Du hast ${round.right} von ${n} Bedeutungen ${round.mode==='write'?'selbst geschrieben':'richtig erkannt'}.`} ${round.manual?`${round.manual} ${round.manual===1?'Antwort hast':'Antworten hast'} du selbst als passend gewertet. `:''}${bad?`Die übrigen ${bad} ${bad===1?'Vokabel kannst':'Vokabeln kannst'} du gleich noch einmal üben.`:'Alle Wörter dieser Runde waren richtig.'}</p><div class="result-actions">${bad?'<button class="primary" data-action="retry">Diese Fehler wiederholen</button>':'<button class="primary" data-action="again">Neue Runde starten</button>'}<button class="secondary" data-action="home">Zur Übersicht</button></div></section>${bad?`<section class="panel missed"><h2>Noch einmal anschauen</h2>${listWords(round.missed)}</section>`:''}<p class="hint" style="text-align:center;margin-top:17px">${persist?'':'Dein Lernstand wird nicht gespeichert. '}Zwei richtige Antworten hintereinander machen ein Wort in diesem Level sicher.</p></section>`;document.getElementById('result-title')?.focus({preventScroll:true});}
function render(){if(location.hash==='#spielen'&&round&&round.index<round.items.length)play();else if(location.hash==='#ergebnis'&&round&&round.index>=round.items.length)result();else{round=null;renderHome();}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.mode){mode=b.dataset.mode;renderHome();app.querySelector(`[data-mode="${mode}"]`)?.focus({preventScroll:true});return;}if(b.dataset.section){section=b.dataset.section;renderHome();app.querySelector(`[data-section="${section}"]`)?.focus({preventScroll:true});return;}if(b.dataset.length){length=b.dataset.length==='all'?'all':Number(b.dataset.length);renderHome();app.querySelector(`[data-length="${length}"]`)?.focus({preventScroll:true});return;}if(b.hasAttribute('data-answer'))return answer(Number(b.dataset.answer));if(b.hasAttribute('data-self'))return selfAnswer(b.dataset.self==='true');switch(b.dataset.action){case'home':home();window.scrollTo({top:0,behavior:'instant'});break;case'start':start();window.scrollTo({top:0,behavior:'instant'});break;case'review':start(difficult(),true);window.scrollTo({top:0,behavior:'instant'});break;case'reveal':reveal();break;case'next':next();break;case'retry':{const missed=[...round.missed];start(missed,true);window.scrollTo({top:0,behavior:'instant'});break;}case'again':start();window.scrollTo({top:0,behavior:'instant'});break;case'reset':resetProgress();break;case'skip-write':checkWritten(true);break;case'accept-written':acceptWritten();break;}});
app.addEventListener('input',e=>{if(e.target.id!=='search')return;const q=e.target.value.trim().toLocaleLowerCase('de');document.getElementById('word-list').innerHTML=listWords(WORDS.filter(w=>(w.en+' '+w.de).toLocaleLowerCase('de').includes(q)));});
app.addEventListener('change',e=>{if(e.target.id==='save-progress')setPersistence(e.target.checked);});
app.addEventListener('submit',e=>{if(e.target.id==='write-form'){e.preventDefault();checkWritten();}});
window.addEventListener('hashchange',render);
window.addEventListener('keydown',e=>{if(!round||location.hash!=='#spielen'||e.ctrlKey||e.metaKey||e.altKey||['INPUT','TEXTAREA','SELECT','BUTTON'].includes(document.activeElement?.tagName))return;if(round.mode==='quiz'&&!round.locked&&/^[1-4]$/.test(e.key)){e.preventDefault();answer(Number(e.key)-1);}});
render();
</script>
