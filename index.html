<script>
'use strict';
// Alle Inhalte, Stile und Funktionen sind in dieser Datei enthalten.
const CHAPTERS=JSON.parse(document.getElementById('chapters').textContent);
let selectedChapter=null;
const WORDS=JSON.parse(document.getElementById('vocabulary').textContent).map((w,i)=>({...w,id:w.id||'w'+i,chapter:w.chapter||CHAPTERS[0].id}));
const MAIN=WORDS.filter(w=>w.s!=='Sätze');
const KEY='wordwise-theme2-v2',LEGACY_KEY='wordwise-theme2-v1',PREF_KEY='wordwise-save-progress';
const app=document.getElementById('app');
const sectionLabels={all:'Alle Vokabeln',I:'Einstieg',A1:'A1 · Körperpflege',A2:'A2 · Mein Morgen',A3:'A3 · Beschreiben',A4:'A4 · Geschichte',A6:'A6 · Über mich',A7:'A7 · Frühstück',Sätze:'Sätze & Aufträge'};
const modeLabels={quiz:'Level 1 · Auswählen',write:'Level 2 · Selbst antworten',cards:'Lernkarten'};
let mode='quiz',section='all',length=10,round=null,storageOK=true,persist=true;
let progress={quiz:{},write:{},cards:{}};
function cleanRecords(input){const out={};if(!input||typeof input!=='object'||Array.isArray(input))return out;for(const w of WORDS){const r=input[w.id];if(r&&Number.isInteger(r.seen)&&r.seen>=0&&Number.isInteger(r.streak)&&r.streak>=0&&typeof r.difficult==='boolean')out[w.id]={seen:r.seen,streak:r.streak,difficult:r.difficult};}return out;}
function loadProgress(){let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||'null');if(!saved){const old=JSON.parse(localStorage.getItem(LEGACY_KEY)||'{}');saved={quiz:old,write:{},cards:{}};}}catch(e){storageOK=false;}return {quiz:cleanRecords(saved?.quiz),write:cleanRecords(saved?.write),cards:cleanRecords(saved?.cards)};}
try{persist=localStorage.getItem(PREF_KEY)!=='false';if(persist)progress=loadProgress();}catch(e){storageOK=false;}
function currentChapter(){return CHAPTERS.find(c=>c.id===selectedChapter)||CHAPTERS[0];}
function chapterWords(id=currentChapter().id){return WORDS.filter(w=>w.chapter===id);}
function chapterStats(id,level){const words=chapterWords(id).filter(w=>w.s!=='Sätze'),records=progress[level]||{};return {total:words.length,known:words.filter(w=>(records[w.id]?.streak||0)>=2).length,work:words.filter(w=>(records[w.id]?.seen||0)>0&&(records[w.id]?.streak||0)<2).length,open:words.filter(w=>!records[w.id]?.seen).length};}
function chapterSectionLabels(){const sections=new Set(chapterWords().flatMap(w=>w.s.split(' / ')));return Object.fromEntries([['all','Alle Vokabeln'],...Object.entries(sectionLabels).filter(([id])=>id!=='all'&&sections.has(id)),...[...sections].filter(id=>!sectionLabels[id]).map(id=>[id,id])]);}
function updateChapterHeader(){const label=document.getElementById('edition-label');if(label)label.textContent=selectedChapter?'Englisch · '+currentChapter().title:'Englisch · Vokabeltraining';document.title='Wordwise · '+(selectedChapter?currentChapter().title:'Deine Kapitel');}
function selectChapter(id){if(!CHAPTERS.some(c=>c.id===id)||!chapterWords(id).length)return;cancelSpeech();round=null;selectedChapter=id;section='all';nav('#start');window.scrollTo({top:0,behavior:'instant'});}
function showChapters(){cancelSpeech();round=null;selectedChapter=null;nav('#kapitel');window.scrollTo({top:0,behavior:'instant'});}
function renderChapters(){updateChapterHeader();app.innerHTML=`${notice()}<section class="hero chapter-hero"><div><p class="eyebrow">Dein Englischtraining</p><h1>Ein Kapitel.<br>Ein Schritt weiter.</h1><p class="lead">Wähle dein Kapitel. Übe die Wörter zuerst mit Antworten und später ohne Vorgaben. Dein Lernstand wird für jedes Kapitel und jeden Level getrennt gezählt.</p></div><span class="hero-tag">${CHAPTERS.length} ${CHAPTERS.length===1?'Kapitel':'Kapitel'} bereit</span></section><div class="chapter-grid">${CHAPTERS.map(c=>{const q=chapterStats(c.id,'quiz'),w=chapterStats(c.id,'write');return `<section class="panel chapter-card"><p class="eyebrow">${q.total} Vokabeln</p><h2>${esc(c.title)}</h2><p class="chapter-description">${esc(c.subtitle||'')}</p><p class="chapter-source">${esc(c.source||'')}</p><div class="chapter-progress-row"><span>Level 1 · Auswählen</span><strong>${q.known} / ${q.total} sicher</strong></div><div class="chapter-progress-bar" aria-hidden="true"><span style="width:${q.total?q.known/q.total*100:0}%"></span></div><div class="chapter-progress-row"><span>Level 2 · Selbst antworten</span><strong>${w.known} / ${w.total} sicher</strong></div><div class="chapter-progress-bar" aria-hidden="true"><span style="width:${w.total?w.known/w.total*100:0}%"></span></div><p class="chapter-state">${w.total&&w.known===w.total?'Kapitel geschafft · Alle Vokabeln in Level 2 sicher.':q.open===q.total&&w.open===w.total?'Bereit für deinen ersten Versuch.':'Du bist im Training. Mach in deinem Tempo weiter.'}</p><button class="primary wide" data-chapter="${esc(c.id)}"><span>${q.open===q.total&&w.open===w.total?'Kapitel öffnen':'Weiterüben'}</span><span aria-hidden="true">→</span></button></section>`;}).join('')}<section class="chapter-future"><h2>Dein Wortschatz wächst.</h2><p>Weitere Kapitel kommen hier dazu. Die bisherigen Kapitel und ihre Lernstände bleiben erhalten.</p></section></div><p class="chapter-note">„Sicher“ bedeutet: zweimal hintereinander richtig im jeweiligen Level. Die Kapitel sind unabhängig voneinander wählbar. Einen Lernstand zurücksetzen oder das Speichern ausschalten kannst du innerhalb eines Kapitels.</p>`;}

function activeRecords(){return progress[mode];}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function pool(){const words=chapterWords();return section==='all'?words.filter(w=>w.s!=='Sätze'):words.filter(w=>section==='Sätze'?w.s==='Sätze':w.s.split(' / ').includes(section));}
function difficult(){return chapterWords().filter(w=>activeRecords()[w.id]?.difficult);}
function stats(){return chapterStats(currentChapter().id,mode);}
function save(){if(!persist)return;try{localStorage.setItem(KEY,JSON.stringify(progress));}catch(e){storageOK=false;}}
function record(w,right){const records=activeRecords(),r=records[w.id]||{seen:0,streak:0,difficult:false};r.seen++;r.streak=right?r.streak+1:0;if(!right)r.difficult=true;else if(r.streak>=2)r.difficult=false;records[w.id]=r;save();}
function setPersistence(enabled){persist=enabled;progress=enabled?loadProgress():{quiz:{},write:{},cards:{}};try{localStorage.setItem(PREF_KEY,String(enabled));}catch(e){storageOK=false;}renderHome();}
function resetProgress(){const chapter=selectedChapter?currentChapter():null;if(!confirm(chapter?`Lernstand von ${chapter.title} für beide Levels und die Lernkarten löschen? Andere Kapitel bleiben erhalten.`:'Alle gespeicherten Lernstände löschen und neu anfangen?'))return;cancelSpeech();const saved=loadProgress();if(chapter){const ids=chapterWords(chapter.id).map(w=>w.id);for(const level of ['quiz','write','cards'])for(const id of ids){delete progress[level][id];delete saved[level][id];}}else{progress={quiz:{},write:{},cards:{}};for(const level of ['quiz','write','cards'])saved[level]={};}try{if(Object.values(saved).some(level=>Object.keys(level).length))localStorage.setItem(KEY,JSON.stringify(saved));else localStorage.removeItem(KEY);localStorage.removeItem(LEGACY_KEY);}catch(e){storageOK=false;}round=null;nav('#start');}
function notice(){return storageOK?'':'<div class="notice" role="status">Dein Browser erlaubt gerade kein Speichern. Du kannst spielen; dein Lernstand bleibt nur bis zum Schließen oder Neuladen dieser Seite erhalten.</div>';}
function nav(hash){if(location.hash===hash)render();else location.hash=hash;}
function home(){cancelSpeech();round=null;nav('#start');}

function listWords(items){return items.length?items.map(w=>`<div class="word-row"><span class="word-en" lang="en">${esc(w.en)}</span><span class="word-de">${esc(w.de)}</span><span class="badge">${esc(w.s)}${w.p?' · S. '+w.p:''}</span></div>`).join(''):'<p class="empty">Kein passender Eintrag gefunden.</p>';}
function choicesFor(w){const source=WORDS.filter(x=>x.chapter===w.chapter&&(x.s==='Sätze')===(w.s==='Sätze'));const seen=new Set([w.de]);const others=[];for(const x of shuffle(source)){if(!seen.has(x.de)){seen.add(x.de);others.push(x);if(others.length===3)break;}}return shuffle([w,...others]);}
function start(items=pool(),isReview=false){if(!items.length)return;if(!selectedChapter)selectedChapter=items[0].chapter;cancelSpeech();const count=length==='all'?items.length:Math.min(length,items.length);round={mode,manual:0,items:shuffle(items).slice(0,count),index:0,right:0,missed:[],locked:false,revealed:false,options:null,review:isReview};nav('#spielen');}
function current(){return round.items[round.index];}
function play(){cancelSpeech();if(!round)return home();const w=current();if(round.mode==='quiz'&&!round.options)round.options=choicesFor(w);const total=round.items.length;
const controls=round.mode==='quiz'?`<div class="answers">${round.options.map((x,i)=>`<button class="answer" data-answer="${i}"><span class="answer-key" aria-hidden="true">${i+1}</span><span>${esc(x.de)}</span></button>`).join('')}</div>`:round.mode==='write'?`<form id="write-form" class="write-form"><label class="write-label" for="written-answer">Deine deutsche Übersetzung</label><input class="write-input" id="written-answer" name="answer" type="text" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="Bedeutung eingeben …" aria-describedby="writing-hint speech-status"><p class="writing-hint" id="writing-hint">Eine passende Übersetzung reicht. Groß- und Kleinschreibung sowie Satzzeichen spielen keine Rolle.</p>${speechMarkup()}<div class="write-controls"><button class="primary" id="check-answer" type="submit">Antwort prüfen</button><button class="secondary" type="button" data-action="skip-write">Weiß ich noch nicht</button></div></form>`:`<button class="primary" id="reveal" data-action="reveal">Lösung aufdecken</button><div id="card-back" hidden><div class="card-solution">${esc(w.de)}</div><p class="hint">Sei ehrlich zu dir: Konntest du die Bedeutung vorher schon?</p><div class="self-buttons"><button class="secondary" data-self="false">Noch üben</button><button class="primary" data-self="true">Gewusst ✓</button></div></div>`;
app.innerHTML=`${notice()}<section class="play-wrap"><div class="play-top"><button class="back" data-action="home">← Zur Übersicht</button><span class="play-label">${modeLabels[round.mode]}${round.review?' · Wiederholung':''}</span></div><div class="progress" role="progressbar" aria-label="Fortschritt der Runde" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${round.index}"><div class="progress-fill" style="width:${round.index/total*100}%"></div></div><div class="progress-info"><span>Wort ${round.index+1} von ${total}</span><span>${round.right} ${round.mode==='cards'?'gewusst':'richtig'}</span></div><section class="panel question-panel" aria-labelledby="question"><div class="question-meta">${w.s==='Sätze'?'Sätze & Arbeitsaufträge':esc(currentChapter().title)+' · '+esc(w.s)} ${w.p?' · Seite '+w.p:''}</div><h1 class="question-word ${w.en.length>27?'long':''}" id="question" lang="en" tabindex="-1">${esc(w.en)}</h1><p class="question-prompt">${round.mode==='quiz'?'Welche deutsche Bedeutung passt?':round.mode==='write'?'Tippe oder sprich die Bedeutung auf Deutsch.':'Weißt du, was das auf Deutsch heißt? Überlege zuerst.'}</p>${controls}<div id="feedback" role="status" aria-live="polite"></div><button class="primary next" data-action="next" hidden>${round.index+1===total?'Runde abschließen':'Nächstes Wort →'}</button></section><p class="hint" style="text-align:center;margin-top:17px">${persist?'':'Ohne Speichern · '}${round.mode==='cards'?'Du entscheidest selbst, welche Wörter du noch üben möchtest.':'Erst in Ruhe überlegen. Du hast so viel Zeit, wie du brauchst.'}</p></section>`;document.getElementById('question')?.focus({preventScroll:true});}
function answer(index){if(!round||round.mode!=='quiz'||round.locked)return;const chosen=round.options[index];if(!chosen)return;round.locked=true;const w=current(),right=chosen.id===w.id;settle(right);const buttons=[...app.querySelectorAll('[data-answer]')];buttons.forEach((b,i)=>{b.disabled=true;if(round.options[i].id===w.id){b.classList.add('correct');b.querySelector('.answer-key').textContent='✓';}else if(i===index){b.classList.add('wrong');b.querySelector('.answer-key').textContent='×';}});const fb=document.getElementById('feedback');fb.className='feedback'+(right?'':' wrong');fb.innerHTML=`<strong>${right?'Richtig, gut gemacht!':'Noch nicht ganz – merk dir dieses Wort:'}</strong><span lang="en">${esc(w.en)}</span> = ${esc(w.de)}${!storageOK?'<div class="hint">Der Lernstand kann gerade nur für diese Sitzung behalten werden.</div>':''}`;const next=app.querySelector('[data-action="next"]');next.hidden=false;next.focus({preventScroll:true});}

function normalizeAnswer(value){return value.normalize('NFKC').toLocaleLowerCase('de').replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').replace(/[’'"„“.,!?;…()\/\-–—]/g,' ').replace(/\s+/g,' ').trim().replace(/^(der|die|das|ein|eine|einen|einem|einer|eines|den|dem|des)\s+/,'');}
function acceptedAnswers(w){const plain=w.de.replace(/\([^)]*\)/g,'').trim(),alternatives=ALIASES[w.en]||(w.s==='Sätze'?[]:plain.split(/[,;\/]/));return new Set([w.de,plain,...alternatives].map(normalizeAnswer).filter(Boolean));}
function isAccepted(w,value){const v=normalizeAnswer(value);return !!v&&acceptedAnswers(w).has(v);}
// Der Browser erkennt die deutsche Antwort; diese Seite nimmt kein Audio auf und speichert keines.
let speech=null;
function speechConstructor(){return window.SpeechRecognition||window.webkitSpeechRecognition;}
function speechUnavailable(){if(window.isSecureContext===false)return 'Öffne das Spiel über seine HTTPS-Webadresse, um das Mikrofon zu nutzen. Tippen ist weiterhin möglich.';if(!speechConstructor())return 'Dieser Browser bietet hier keine Spracheingabe an. Du kannst tippen oder die Mikrofontaste deiner Handy-Tastatur verwenden.';return '';}
function speechMarkup(){const unavailable=speechUnavailable();return `<div class="speech-tools"><button class="secondary speech-btn" type="button" id="speech-button" data-action="speech" aria-pressed="false" aria-describedby="speech-status speech-privacy" ${unavailable?'disabled':''}>🎤 Antwort sprechen</button><p id="speech-status" class="speech-status" role="status" aria-live="polite">${esc(unavailable||'Sprich die deutsche Bedeutung. Der erkannte Text lässt sich vor dem Prüfen korrigieren.')}</p><p class="speech-privacy" id="speech-privacy">Das Mikrofon startet erst nach deinem Klick. Je nach Browser verarbeitet ein Online-Sprachdienst die Aufnahme; dafür kann Internet nötig sein. Diese Seite speichert keine Audioaufnahmen.</p></div>`;}
function setSpeechMessage(message){const status=document.getElementById('speech-status');if(status)status.textContent=message;}
function speechUI(busy,message){const button=document.getElementById('speech-button');if(!button)return;button.textContent=busy?'■ Aufnahme beenden':'🎤 Antwort sprechen';button.setAttribute('aria-pressed',String(busy));button.disabled=!canEditWritten()||!!speechUnavailable();button.classList.toggle('listening',busy);const input=document.getElementById('written-answer');if(input)input.readOnly=busy;const check=document.getElementById('check-answer');if(check)check.disabled=busy||!canEditWritten();if(message)setSpeechMessage(message);}
function speechStillCurrent(s){return speech===s&&round===s.round&&canEditWritten()&&current().id===s.wordId&&document.getElementById('written-answer')===s.input;}
function finishSpeech(s,message,abort=false){if(speech!==s)return;speech=null;clearTimeout(s.timer);if(abort){try{s.recognition.abort();}catch(e){}}if(document.getElementById('written-answer')===s.input)speechUI(false,message);}
function cancelSpeech(message='Aufnahme beendet. Du kannst deine Antwort tippen.'){if(speech)finishSpeech(speech,message,true);}
function speechErrorMessage(error){const messages={
 'not-allowed':'Das Mikrofon wurde nicht freigegeben. Erlaube den Mikrofonzugriff in deinem Browser oder tippe die Antwort.',
 'service-not-allowed':'Der Sprachdienst ist in diesem Browser nicht verfügbar. Tippe die Antwort oder nutze die Mikrofontaste deiner Handy-Tastatur.',
 'audio-capture':'Es konnte kein Mikrofon verwendet werden. Prüfe, ob eine andere App es belegt, oder tippe deine Antwort.',
 'no-speech':'Es wurde keine Sprache erkannt. Tippe erneut auf „Antwort sprechen“ oder schreibe die Antwort.',
 'network':'Der Sprachdienst ist gerade nicht erreichbar. Prüfe deine Internetverbindung oder tippe die Antwort.',
 'language-not-supported':'Die deutsche Spracherkennung ist hier nicht verfügbar. Tippe die Antwort.',
 'aborted':'Aufnahme beendet. Du kannst deine Antwort tippen.'
};return messages[error]||'Die Spracheingabe hat nicht geklappt. Du kannst es erneut versuchen oder deine Antwort tippen.';}
function startSpeech(){if(!canEditWritten())return;if(speech){setSpeechMessage('Aufnahme wird beendet …');try{speech.recognition.stop();}catch(e){cancelSpeech();}return;}
const unavailable=speechUnavailable();if(unavailable){setSpeechMessage(unavailable);return;}
const input=document.getElementById('written-answer');if(!input)return;let recognition;try{const Recognition=speechConstructor();recognition=new Recognition();}catch(e){setSpeechMessage('Die Spracheingabe konnte nicht gestartet werden. Tippe deine Antwort.');return;}
const s={recognition,input,round,wordId:current().id,timer:null,gotResult:false,message:''};speech=s;recognition.lang='de-DE';recognition.continuous=false;recognition.interimResults=false;recognition.maxAlternatives=1;
speechUI(true,'Mikrofon wird gestartet … Erlaube den Zugriff, wenn dein Browser danach fragt.');
s.timer=setTimeout(()=>finishSpeech(s,'Die Spracheingabe hat zu lange gedauert. Versuche es erneut oder tippe die Antwort.',true),30000);
recognition.onstart=()=>{if(!speechStillCurrent(s)){try{recognition.abort();}catch(e){}return;}clearTimeout(s.timer);s.timer=setTimeout(()=>finishSpeech(s,s.gotResult?s.message:'Aufnahme beendet. Versuche es erneut oder tippe die Antwort.',true),20000);setSpeechMessage('Ich höre zu … Sprich die deutsche Bedeutung.');};
recognition.onresult=event=>{if(!speechStillCurrent(s))return;const parts=[];for(let i=event.resultIndex||0;i<event.results.length;i++){const result=event.results[i];if(result.isFinal===false)continue;const text=result[0]?.transcript;if(typeof text==='string'&&text.trim())parts.push(text.trim());}const transcript=parts.join(' ').slice(0,500);if(!transcript)return;s.gotResult=true;s.input.value=transcript;s.message=`Erkannt: „${transcript}“. Du kannst den Text korrigieren und dann auf „Antwort prüfen“ tippen.`;finishSpeech(s,s.message,true);};
recognition.onerror=event=>{if(!speechStillCurrent(s))return;finishSpeech(s,speechErrorMessage(event.error),true);};
recognition.onend=()=>{if(!speechStillCurrent(s))return;finishSpeech(s,s.gotResult?s.message:speechErrorMessage('no-speech'));};
try{recognition.start();}catch(e){finishSpeech(s,e?.name==='NotAllowedError'?speechErrorMessage('not-allowed'):'Die Spracheingabe konnte nicht starten. Du kannst deine Antwort tippen.',true);}}

function canEditWritten(){return !!round&&round.mode==='write'&&round.index<round.items.length&&(!round.locked||(!round.writeRight&&!round.correctionSolved));}
function writtenControls(disabled){const input=document.getElementById('written-answer');input.disabled=disabled;input.readOnly=false;document.getElementById('check-answer').disabled=disabled;const mic=document.getElementById('speech-button');if(mic)mic.disabled=disabled||!!speechUnavailable();}
function checkWritten(skipped=false){if(!canEditWritten()||(skipped&&round.locked))return;if(speech&&!skipped){setSpeechMessage('Beende zuerst die Aufnahme. Danach kannst du den Text prüfen.');return;}cancelSpeech();const input=document.getElementById('written-answer'),value=input.value.trim(),fb=document.getElementById('feedback');if(!value&&!skipped){fb.className='feedback';fb.textContent='Schreibe eine Bedeutung oder wähle „Weiß ich noch nicht“.';input.focus({preventScroll:true});return;}
const w=current(),right=!skipped&&isAccepted(w,value);
if(round.locked){round.correctionSolved=right;writtenControls(right);fb.className='feedback'+(right?'':' wrong');fb.innerHTML=`<strong>${right?'Jetzt stimmt es!':'Noch nicht erkannt – du kannst weiter korrigieren.'}</strong>${right?'Das Wort bleibt für eine spätere Wiederholung vorgemerkt. Die Punkte der ersten Antwort bleiben unverändert.':`Deine Antwort: ${esc(value)}<br><span lang="en">${esc(w.en)}</span> = ${esc(w.de)}<br>Bearbeite das Feld oder sprich die Antwort erneut ein.<br><button class="manual-answer" data-action="accept-written">Meine Übersetzung passt auch · als richtig werten</button>`}`;if(right)app.querySelector('[data-action="next"]').focus({preventScroll:true});else input.focus({preventScroll:true});return;}
round.locked=true;round.writeRight=right;round.correctionSolved=false;round.skipped=skipped;const old=activeRecords()[w.id];round.beforeRecord=old?{...old}:null;settle(right);writtenControls(right);document.getElementById('check-answer').textContent=right?'Antwort geprüft':'Korrektur prüfen';app.querySelector('[data-action="skip-write"]').disabled=true;
fb.className='feedback'+(right?'':' wrong');fb.innerHTML=`<strong>${right?'Richtig, gut gemacht!':skipped?'Dieses Wort üben wir noch einmal.':'Nicht automatisch erkannt – vergleiche deine Antwort.'}</strong>${value?`Deine Antwort: ${esc(value)}<br>`:''}<span lang="en">${esc(w.en)}</span> = ${esc(w.de)}${!right?'<br>Du kannst deine Antwort im Feld korrigieren oder erneut einsprechen.':''}${!right&&!skipped?'<br><button class="manual-answer" data-action="accept-written">Meine Übersetzung passt auch · als richtig werten</button>':''}`;
const button=app.querySelector('[data-action="next"]');button.hidden=false;if(right)button.focus({preventScroll:true});else input.focus({preventScroll:true});}
function acceptWritten(){if(!round||round.mode!=='write'||!round.locked||round.writeRight||round.correctionSolved||round.skipped)return;const w=current();if(round.beforeRecord)activeRecords()[w.id]={...round.beforeRecord};else delete activeRecords()[w.id];round.missed=round.missed.filter(x=>x.id!==w.id);round.right++;round.manual++;round.writeRight=true;record(w,true);writtenControls(true);const fb=document.getElementById('feedback');fb.className='feedback';fb.innerHTML=`<strong>Von dir als passend gewertet.</strong>Vergleiche die Bedeutung sorgfältig: <span lang="en">${esc(w.en)}</span> = ${esc(w.de)}`;app.querySelector('[data-action="next"]').focus({preventScroll:true});}

function settle(right){const w=current();if(right)round.right++;else round.missed.push(w);record(w,right);}
function reveal(){if(!round||round.mode!=='cards'||round.revealed)return;round.revealed=true;document.getElementById('reveal').hidden=true;document.getElementById('card-back').hidden=false;app.querySelector('[data-self]')?.focus({preventScroll:true});}
function selfAnswer(right){if(!round||round.mode!=='cards'||!round.revealed||round.locked)return;round.locked=true;settle(right);next();}
function next(){if(!round||!round.locked)return;cancelSpeech();round.index++;if(round.index>=round.items.length){nav('#ergebnis');}else{round.locked=false;round.writeRight=false;round.correctionSolved=false;round.revealed=false;round.options=null;play();}window.scrollTo({top:0,behavior:'instant'});}
function result(){if(!round||round.index<round.items.length)return home();const n=round.items.length,bad=round.missed.length;app.innerHTML=`${notice()}<section class="play-wrap"><section class="panel result"><p class="eyebrow">${modeLabels[round.mode]} · Runde geschafft</p><div class="result-circle" aria-label="${round.right} von ${n}">${round.right}/${n}</div><h1 tabindex="-1" id="result-title">${bad?'Jede Runde bringt dich weiter.':'Das hast du richtig gut gemacht!'}</h1><p class="lead">${round.mode==='cards'?`Du hast bei ${round.right} von ${n} Karten „Gewusst“ gewählt.`:`Du hast ${round.right} von ${n} Bedeutungen ${round.mode==='write'?'selbst beantwortet':'richtig erkannt'}.`} ${round.manual?`${round.manual} ${round.manual===1?'Antwort hast':'Antworten hast'} du selbst als passend gewertet. `:''}${bad?`Die übrigen ${bad} ${bad===1?'Vokabel kannst':'Vokabeln kannst'} du gleich noch einmal üben.`:'Alle Wörter dieser Runde waren richtig.'}</p><div class="result-actions">${bad?'<button class="primary" data-action="retry">Diese Fehler wiederholen</button>':'<button class="primary" data-action="again">Neue Runde starten</button>'}<button class="secondary" data-action="home">Zur Übersicht</button></div></section>${bad?`<section class="panel missed"><h2>Noch einmal anschauen</h2>${listWords(round.missed)}</section>`:''}<p class="hint" style="text-align:center;margin-top:17px">${persist?'':'Dein Lernstand wird nicht gespeichert. '}Zwei richtige Antworten hintereinander machen ein Wort in diesem Level sicher.</p></section>`;document.getElementById('result-title')?.focus({preventScroll:true});}
function render(){cancelSpeech();if(location.hash==='#kapitel'){round=null;selectedChapter=null;renderChapters();return;}if(location.hash==='#spielen'&&round&&round.index<round.items.length)play();else if(location.hash==='#ergebnis'&&round&&round.index>=round.items.length)result();else{round=null;renderHome();}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.chapter){selectChapter(b.dataset.chapter);return;}if(b.dataset.mode){mode=b.dataset.mode;renderHome();app.querySelector(`[data-mode="${mode}"]`)?.focus({preventScroll:true});return;}if(b.dataset.section){section=b.dataset.section;renderHome();app.querySelector(`[data-section="${section}"]`)?.focus({preventScroll:true});return;}if(b.dataset.length){length=b.dataset.length==='all'?'all':Number(b.dataset.length);renderHome();app.querySelector(`[data-length="${length}"]`)?.focus({preventScroll:true});return;}if(b.hasAttribute('data-answer'))return answer(Number(b.dataset.answer));if(b.hasAttribute('data-self'))return selfAnswer(b.dataset.self==='true');switch(b.dataset.action){case'chapters':showChapters();break;case'home':home();window.scrollTo({top:0,behavior:'instant'});break;case'start':start();window.scrollTo({top:0,behavior:'instant'});break;case'review':start(difficult(),true);window.scrollTo({top:0,behavior:'instant'});break;case'reveal':reveal();break;case'next':next();break;case'retry':{const missed=[...round.missed];start(missed,true);window.scrollTo({top:0,behavior:'instant'});break;}case'again':start();window.scrollTo({top:0,behavior:'instant'});break;case'reset':resetProgress();break;case'speech':startSpeech();break;case'skip-write':checkWritten(true);break;case'accept-written':acceptWritten();break;}});
app.addEventListener('input',e=>{if(e.target.id!=='search')return;const q=e.target.value.trim().toLocaleLowerCase('de');document.getElementById('word-list').innerHTML=listWords(chapterWords().filter(w=>(w.en+' '+w.de).toLocaleLowerCase('de').includes(q)));});
app.addEventListener('change',e=>{if(e.target.id==='save-progress')setPersistence(e.target.checked);});
app.addEventListener('submit',e=>{if(e.target.id==='write-form'){e.preventDefault();checkWritten();}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)cancelSpeech('Aufnahme beim Verlassen der Seite beendet.');});
window.addEventListener('pagehide',()=>cancelSpeech());
window.addEventListener('hashchange',render);
window.addEventListener('keydown',e=>{if(!round||location.hash!=='#spielen'||e.ctrlKey||e.metaKey||e.altKey||['INPUT','TEXTAREA','SELECT','BUTTON'].includes(document.activeElement?.tagName))return;if(round.mode==='quiz'&&!round.locked&&/^[1-4]$/.test(e.key)){e.preventDefault();answer(Number(e.key)-1);}});
render();
</script>
</body>
</html>
