<script>
'use strict';
const CHAPTERS=JSON.parse(document.getElementById('chapters').textContent);
const WORDS=JSON.parse(document.getElementById('vocabulary').textContent).map((w,i)=>({...w,id:w.id||'w'+i,chapter:w.chapter||CHAPTERS[0].id}));
const KEY='wordwise-theme2-v2',LEGACY_KEY='wordwise-theme2-v1',PREF_KEY='wordwise-save-progress';
const LEVELS={quiz:{n:1,title:'Erkennen',short:'Auswählen',hint:'Englisch sehen · Deutsch auswählen',language:'de-DE'},write:{n:2,title:'Erinnern',short:'Deutsch antworten',hint:'Englisch sehen · Deutsch tippen oder sprechen',language:'de-DE'},reverse:{n:3,title:'Englisch bilden',short:'Englisch antworten',hint:'Deutsch sehen · Englisch tippen oder sprechen',language:'en-GB'},sentence:{n:4,title:'Im Satz anwenden',short:'Satz ergänzen',hint:'Ein englisches Wort oder eine Wendung ergänzen',language:'en-GB'},cards:{n:0,title:'Lernkarten',short:'Lernkarten',hint:'Entdecken · aufdecken · selbst einschätzen',language:'de-DE'}};
const sectionLabels={all:'Alle Vokabeln',I:'Einstieg',A1:'A1 · Körperpflege',A2:'A2 · Mein Morgen',A3:'A3 · Beschreiben',A4:'A4 · Geschichte',A6:'A6 · Über mich',A7:'A7 · Frühstück',Sätze:'Arbeitsaufträge'};
const app=document.getElementById('app');
let selectedChapter=null,mode='quiz',section='all',length=10,round=null,persist=true,storageOK=true,speech=null,tts=null;
const emptyProgress=()=>Object.fromEntries(Object.keys(LEVELS).map(k=>[k,{}]));
let progress=emptyProgress();
const DAY=86400000,MIN_REVIEW_GAP=20*3600000,INTERVALS=[1,3,7,14,30];
function dayKey(time=Date.now()){const d=new Date(time);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');}
function cleanRecords(data){const out={};if(!data||typeof data!=='object'||Array.isArray(data))return out;for(const w of WORDS){const r=data[w.id];if(!r||!Number.isInteger(r.seen)||r.seen<0||!Number.isInteger(r.streak)||r.streak<0)continue;out[w.id]={seen:r.seen,streak:r.streak,difficult:!!r.difficult,lastAt:Number.isFinite(r.lastAt)?r.lastAt:0,lastCorrectAt:Number.isFinite(r.lastCorrectAt)?r.lastCorrectAt:0,spacingAt:Number.isFinite(r.spacingAt)?r.spacingAt:0,stage:Number.isInteger(r.stage)?Math.max(0,Math.min(5,r.stage)):0,dueAt:Number.isFinite(r.dueAt)?r.dueAt:0,lastDay:typeof r.lastDay==='string'?r.lastDay:'',lapses:Number.isInteger(r.lapses)?r.lapses:0};}return out;}
function loadProgress(){let data;try{data=JSON.parse(localStorage.getItem(KEY)||'null');if(!data)data={quiz:JSON.parse(localStorage.getItem(LEGACY_KEY)||'{}')};}catch(e){storageOK=false;}return Object.fromEntries(Object.keys(LEVELS).map(k=>[k,cleanRecords(data?.[k])]));}
try{persist=localStorage.getItem(PREF_KEY)!=='false';if(persist)progress=loadProgress();}catch(e){storageOK=false;}
function save(){if(!persist)return;try{localStorage.setItem(KEY,JSON.stringify(progress));}catch(e){storageOK=false;}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function currentChapter(){return CHAPTERS.find(c=>c.id===selectedChapter)||CHAPTERS[0];}
function chapterWords(id=currentChapter().id){return WORDS.filter(w=>w.chapter===id);}
function levelWords(id=currentChapter().id,level=mode){return chapterWords(id).filter(w=>w.s!=='Sätze'&&(level!=='sentence'||w.contexts?.length));}
function activeRecords(level=mode){return progress[level];}
function retained(r){return !!r&&!r.difficult&&r.stage>=3;}
function isDue(r,now=Date.now()){return !!r&&r.seen>0&&r.dueAt<=now;}
function chapterStats(id=currentChapter().id,level=mode,now=Date.now()){const words=levelWords(id,level),records=progress[level];return {total:words.length,seen:words.filter(w=>records[w.id]?.seen).length,today:words.filter(w=>{const r=records[w.id];return r&&!r.difficult&&r.lastDay===dayKey(now);}).length,retained:words.filter(w=>retained(records[w.id])).length,due:words.filter(w=>isDue(records[w.id],now)).length,work:words.filter(w=>records[w.id]?.difficult).length,new:words.filter(w=>!records[w.id]?.seen).length};}
function pool(){const words=chapterWords();if(section==='Sätze')return mode==='sentence'?[]:words.filter(w=>w.s==='Sätze');return words.filter(w=>w.s!=='Sätze'&&(mode!=='sentence'||w.contexts?.length)&&(section==='all'||w.s.split(' / ').includes(section)));}
function sections(){const keys=new Set(chapterWords().filter(w=>mode!=='sentence'||w.contexts?.length).flatMap(w=>w.s.split(' / ')));return [['all','Alle Vokabeln'],...Object.entries(sectionLabels).filter(([k])=>k!=='all'&&keys.has(k)),...[...keys].filter(k=>!sectionLabels[k]).map(k=>[k,k])];}
function difficult(){return pool().filter(w=>activeRecords()[w.id]?.difficult);}
function record(w,right,{manual=false,assisted=false}={}){const now=Date.now(),r=activeRecords()[w.id]||{seen:0,streak:0,difficult:false,lastAt:0,lastCorrectAt:0,spacingAt:0,stage:0,dueAt:0,lastDay:'',lapses:0};r.seen++;r.lastAt=now;if(!right){r.streak=0;r.difficult=true;r.stage=0;r.spacingAt=0;r.dueAt=now+10*60000;r.lapses++;}else{r.streak++;r.lastCorrectAt=now;r.lastDay=dayKey(now);r.difficult=false;const qualifies=!manual&&!assisted;if(qualifies&&(r.stage===0||now-r.spacingAt>=MIN_REVIEW_GAP)){r.stage=Math.min(5,r.stage+1);r.spacingAt=now;r.dueAt=now+INTERVALS[r.stage-1]*DAY;}else if(!r.dueAt)r.dueAt=now+DAY;}activeRecords()[w.id]=r;save();return r;}
function setPersistence(enabled){cancelSpeech();persist=enabled;progress=enabled?loadProgress():emptyProgress();try{localStorage.setItem(PREF_KEY,String(enabled));}catch(e){storageOK=false;}round=null;render();}
function resetProgress(){const c=selectedChapter?currentChapter():null;if(!confirm(c?`Lernstand von ${c.title} für alle vier Stufen und die Lernkarten löschen? Andere Kapitel bleiben erhalten.`:'Alle Lernstände löschen?'))return;cancelSpeech();stopAudio();const stored=loadProgress(),ids=c?chapterWords(c.id).map(w=>w.id):WORDS.map(w=>w.id);for(const level of Object.keys(LEVELS))for(const id of ids){delete progress[level][id];delete stored[level][id];}try{if(Object.values(stored).some(v=>Object.keys(v).length))localStorage.setItem(KEY,JSON.stringify(stored));else localStorage.removeItem(KEY);localStorage.removeItem(LEGACY_KEY);}catch(e){storageOK=false;}round=null;nav(selectedChapter?'#start':'#kapitel');}
function notice(){return storageOK?'':'<p class="notice" role="status">Speichern ist in diesem Browser gerade nicht möglich. Du kannst weiterüben; beim Neuladen wird dieser Lernstand verworfen.</p>';}

function memoryControls(){return `<details class="settings"><summary>Lernstand & Einstellungen</summary><div class="settings-inner"><label class="toggle-label"><input id="save-progress" type="checkbox" ${persist?'checked':''}> Lernstand speichern</label><p class="small">${persist?'Dein Lernstand bleibt in diesem Browser auf diesem Gerät.':'Ohne Speichern: Nach jedem Neuladen beginnst du bei null. Früher gespeicherte Lernstände bleiben bis zum Löschen erhalten.'}</p><button class="text-btn" data-action="reset">${selectedChapter?'Dieses Kapitel neu anfangen':'Alle Lernstände löschen'}</button><p class="small">„Für heute gekonnt“ zeigt einen richtigen Abruf heute. „Mit Abstand bestätigt“ verlangt richtige Abrufe an mindestens drei Zeitpunkten mit jeweils mindestens 20 Stunden Abstand. Der Startplan nutzt 1, 3, 7, 14 und 30 Tage; diese Abstände sind eine praktische Vorgabe, kein individuell berechnetes Optimum.</p></div></details>`;}
function recommendedItems(items=pool(),count=10){const rec=activeRecords(),due=shuffle(items.filter(w=>isDue(rec[w.id]))).sort((a,b)=>(rec[a.id]?.dueAt||0)-(rec[b.id]?.dueAt||0)),fresh=shuffle(items.filter(w=>!rec[w.id]?.seen)),rest=shuffle(items.filter(w=>rec[w.id]?.seen&&!isDue(rec[w.id])));return [...due,...fresh,...rest].slice(0,count);}

function renderChapters(){const c=pickChapter(),due=chapterStats(c.id,mode).due;app.innerHTML=`${notice()}<section class="welcome"><p class="eyebrow">DEIN ENGLISCHTRAINING</p><h1>Wörter werden<br>zu Möglichkeiten<span class="accent">.</span></h1><p class="lead">In kleinen Runden verstehen, erinnern und anwenden.</p></section><section class="quick-card"><div><span class="pill">Deine nächste Runde</span><h2>${esc(c.title)} · 10 Wörter</h2><p>${due?'Wiederholungen sind bereit. Danach kommt Neues dazu.':'Starte direkt. Du kannst die Übungsstufe jederzeit wechseln.'}</p></div><button class="primary" data-quick-chapter="${esc(c.id)}">Jetzt üben <span aria-hidden="true">→</span></button></section><div class="section-heading"><h2>Deine Kapitel</h2><span>${CHAPTERS.length} verfügbar</span></div><div class="chapter-grid">${CHAPTERS.map((c,i)=>{const s=chapterStats(c.id,'write');return `<section class="chapter-card tone-${i%4}"><div class="chapter-top"><span class="chapter-number">${String(i+1).padStart(2,'0')}</span><span class="pill">${s.total} Vokabeln</span></div><h2>${esc(c.title)}</h2><p class="chapter-subtitle">${esc(c.subtitle)}</p><div class="chapter-levels">${['quiz','write','reverse','sentence'].map(k=>{const t=chapterStats(c.id,k);return `<div class="mini-level"><span>${LEVELS[k].n} · ${LEVELS[k].short}</span><strong>${t.retained}/${t.total}</strong><div class="meter" aria-hidden="true"><span style="width:${t.total?t.retained/t.total*100:0}%"></span></div></div>`;}).join('')}</div><p class="small">Die Balken zeigen Abrufe, die mit zeitlichem Abstand bestätigt wurden.</p><button class="secondary wide" data-chapter="${esc(c.id)}">Kapitel öffnen <span aria-hidden="true">→</span></button><p class="source-note">${esc(c.source)}</p></section>`;}).join('')}</div><p class="future-note">Weitere Kapitel ergänzen wir aus deinen nächsten Vokabelfotos. Jedes Kapitel bleibt einzeln wählbar.</p>${memoryControls()}${researchNote()}${footer()}`;}
function researchNote(){return `<details class="settings research"><summary>Warum dieses Training so aufgebaut ist</summary><div class="settings-inner"><p>Erst selbst erinnern, dann Rückmeldung erhalten. Später erneut abrufen. Die Satzübungen wechseln zwischen zwei kurzen Kontexten pro Vokabel. Diese Sätze wurden für das Training neu formuliert.</p><p>Die Stufen sind frei wählbar. Spracherkennung prüft, welches Wort du sagst; sie bewertet weder deine Aussprache zuverlässig noch selbst geschriebene Rechtschreibung. Beim Sprechen wird deshalb nur Wortschatz trainiert.</p><p class="small">Grundlagen: <a href="https://www.frontiersin.org/journals/psychology/articles/10.3389/fpsyg.2021.757262/full" target="_blank" rel="noopener">Abrufen, Feedback und zeitlicher Abstand</a> · <a href="https://pubmed.ncbi.nlm.nih.gov/39453748/" target="_blank" rel="noopener">Wechselnde Satzkontexte (2024)</a> · <a href="https://doi.org/10.1002/acp.70306" target="_blank" rel="noopener">Unterrichtsstudie zum Abrufen und Formulieren (2026)</a>. Diese Forschung stützt die Prinzipien; sie ist kein Wirksamkeitsnachweis für diese konkrete Website.</p></div></details>`;}
function footer(){return '<footer class="footer"><span><strong>wordwise.</strong> · Kapitelweise lernen</span><span>Version 2.0 · Ohne Zeitdruck</span></footer>';}
function renderHome(keepRoundSettings=false){if(!selectedChapter)return renderChapters();const s=chapterStats(),items=pool(),n=Math.min(10,items.length),bad=difficult().length;app.innerHTML=`${notice()}<div class="crumb"><button class="back" data-action="chapters">← Alle Kapitel</button><span>${esc(currentChapter().source)}</span></div><section class="chapter-heading"><p class="eyebrow">${esc(currentChapter().title)}</p><h1>${esc(currentChapter().subtitle)}</h1><p class="lead">Deine nächste kleine Runde wartet.</p></section><section class="quick-card compact"><div><span class="pill">${LEVELS[mode].n?'Stufe '+LEVELS[mode].n:'Lernkarten'}</span><h2>${n} Wörter. Ein guter nächster Schritt.</h2><p>${s.due?s.due+' Wiederholungen sind in dieser Stufe fällig.':'Fällige Wiederholungen kommen zuerst, danach neue Wörter.'}</p></div><button class="primary" data-action="quick" ${n?'':'disabled'}>Jetzt ${n} Wörter üben →</button></section><section class="stats" aria-label="Lernstand der gewählten Stufe"><div><strong>${s.today}</strong><span>Für heute gekonnt</span></div><div><strong>${s.retained}</strong><span>Mit Abstand bestätigt</span></div><div><strong>${s.due}</strong><span>Jetzt wiederholen</span></div></section><section class="panel"><div class="section-heading"><h2>So möchtest du üben</h2><span>Alle Stufen frei wählbar</span></div><div class="level-grid">${['quiz','write','reverse','sentence'].map(k=>`<button class="level-option" data-mode="${k}" aria-pressed="${mode===k}"><span class="level-number">${LEVELS[k].n}</span><span><strong>${LEVELS[k].title}</strong><small>${LEVELS[k].hint}</small></span><span class="selected-dot" aria-hidden="true"></span></button>`).join('')}</div><button class="card-option" data-mode="cards" aria-pressed="${mode==='cards'}">Lernkarten · Neue Wörter erst kennenlernen</button><details class="settings round-settings" ${keepRoundSettings?'open':''}><summary>Runde anpassen · ${esc(section==='all'?'alle Vokabeln':sectionLabels[section]||section)} · ${length==='all'?'alle':length} Wörter</summary><div class="settings-inner"><fieldset><legend>Wortschatz auswählen</legend><div class="chips">${sections().map(([k,v])=>`<button class="chip" data-section="${esc(k)}" aria-pressed="${section===k}">${esc(v)}</button>`).join('')}</div></fieldset><fieldset><legend>Rundenlänge</legend><div class="chips">${[10,20,'all'].map(n=>`<button class="chip" data-length="${n}" aria-pressed="${length===n}">${n==='all'?'Alle':n+' Wörter'}</button>`).join('')}</div></fieldset><button class="secondary wide" data-action="start" ${items.length?'':'disabled'}>Eigene Runde starten →</button></div></details></section><div class="practice-actions"><button class="secondary" data-action="review" ${bad?'':'disabled'}>Schwierige Wörter · ${bad}</button><button class="secondary" data-action="due" ${items.some(w=>isDue(activeRecords()[w.id]))?'':'disabled'}>Nur fällige Wiederholungen</button></div><details class="settings dictionary"><summary>Wörter nachschlagen · ${chapterWords().length} Einträge</summary><div class="settings-inner"><label class="sr-only" for="search">Wort suchen</label><input id="search" type="search" class="search" placeholder="Englisches oder deutsches Wort suchen …"><div class="word-list" id="word-list">${listWords(chapterWords())}</div><p class="small">${esc(currentChapter().note||'')}</p></div></details>${memoryControls()}${researchNote()}${footer()}`;}
function listWords(items){return items.length?items.map(w=>`<div class="word-row"><span lang="en">${esc(w.en)}</span><span>${esc(w.de)}</span><small>${esc(w.s)}</small></div>`).join(''):'<p class="small">Kein passender Eintrag gefunden.</p>';}
function start(items=pool(),review=false,smart=false){if(!items.length)return;cancelSpeech();stopAudio();if(!selectedChapter)selectedChapter=items[0].chapter;const count=length==='all'?items.length:Math.min(length,items.length);round={mode,items:smart?recommendedItems(items,count):shuffle(items).slice(0,count),index:0,right:0,missed:[],manual:0,review,locked:false,correctionSolved:false,options:null,context:null,usedSpeech:false,usedHint:false,skipped:false};nav('#spielen');topPage();}
function quick(chapterId){if(chapterId){selectedChapter=chapterId;section='all';}const items=pool();if(!items.length)return;const oldLength=length;length=10;start(items,false,true);length=oldLength;}
function current(){return round.items[round.index];}
function currentContext(){return round.context;}
function choicesFor(w){const candidates=WORDS.filter(x=>x.chapter===w.chapter&&(x.s==='Sätze')===(w.s==='Sätze')),seen=new Set([normalDE(w.de)]),others=[];for(const x of shuffle(candidates)){const key=normalDE(x.de);if(!seen.has(key)){seen.add(key);others.push(x);if(others.length===3)break;}}return shuffle([w,...others]);}
function englishPrompt(w){return w.en.replace(/\s*\([^)]*\)/g,'').replace(/…/g,'').trim();}
function solutionText(w=current()){return round.mode==='quiz'||round.mode==='write'||round.mode==='cards'?w.de:round.mode==='sentence'?currentContext().answers[0]:englishPrompt(w);}
function sentenceMarkup(context){const parts=context.text.split('___');return `<span lang="en">${esc(parts[0])}<span class="gap" aria-label="Lücke">…</span>${esc(parts[1])}</span>`;}
function inputMarkup(){const english=round.mode==='reverse'||round.mode==='sentence';return `<form id="write-form" class="write-form"><label for="written-answer">${english?'Deine englische Antwort':'Deine deutsche Bedeutung'}</label><input id="written-answer" name="answer" class="write-input" type="text" lang="${english?'en':'de'}" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" placeholder="${english?'Englisch eingeben …':'Bedeutung eingeben …'}" aria-describedby="writing-hint speech-status"><p class="small" id="writing-hint">${english?'Versuche es erst ohne Hilfe. Groß- und Kleinschreibung sowie Satzzeichen werden nicht bewertet.':'Eine passende Übersetzung reicht. Groß- und Kleinschreibung sowie Satzzeichen werden nicht bewertet.'}</p>${speechMarkup()}<div class="write-controls"><button class="primary" id="check-answer" type="submit">Antwort prüfen</button><button class="secondary" type="button" data-action="skip-write">Weiß ich noch nicht</button></div></form>`;}
function play(){cancelSpeech();stopAudio();if(!round)return home();const w=current();if(round.mode==='quiz'&&!round.options)round.options=choicesFor(w);if(round.mode==='sentence'&&!round.context){const contexts=w.contexts||[];round.context=contexts[(activeRecords()[w.id]?.seen||0)%contexts.length];}const kind=round.mode==='sentence'?'ENGLISCH IM SATZ':round.mode==='reverse'?'DEUTSCH → ENGLISCH':'ENGLISCH → DEUTSCH';let prompt,sub;
if(round.mode==='sentence'){prompt=sentenceMarkup(round.context);sub='Gesucht: '+(round.context.cue||w.de);}else if(round.mode==='reverse'){prompt=esc(w.de);sub='Wie heißt das auf Englisch?';}else{prompt=esc(w.en);sub=round.mode==='quiz'?'Welche Bedeutung passt?':round.mode==='cards'?'Überlege zuerst. Decke dann die Lösung auf.':'Was bedeutet das auf Deutsch?';}
const total=round.items.length;app.innerHTML=`${notice()}<section class="play-wrap"><div class="play-top"><button class="back" data-action="home">← Zurück</button><span>${esc(currentChapter().title)} · ${LEVELS[round.mode].n?'Stufe '+LEVELS[round.mode].n:'Lernkarten'}</span></div><div class="play-progress"><span>Wort ${round.index+1} von ${total}</span><strong id="round-score">${round.right} ${round.mode==='cards'?'gewusst':'richtig'}</strong></div><div class="meter main-meter" role="progressbar" aria-label="Rundenfortschritt" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${round.index}"><span style="width:${round.index/total*100}%"></span></div><section class="question panel"><p class="eyebrow">${kind}</p><h1 id="question" class="question-word ${round.mode==='sentence'?'sentence-word':''}" tabindex="-1" ${round.mode==='reverse'?'':'lang="en"'}>${prompt}</h1><p class="question-prompt">${esc(sub)}</p><div class="audio-row"><button class="audio-button" data-action="audio-task" ${canSpeak()?'':'disabled'}>${round.mode==='reverse'?'◖ Aufgabe anhören':round.mode==='sentence'?'◖ Satz mit Lücke anhören':'◖ Englisch anhören'}</button><span id="audio-status" class="small" role="status">${canSpeak()?'':'Vorlesen ist hier nicht verfügbar.'}</span></div>${round.mode==='quiz'?`<div class="answers">${round.options.map((x,i)=>`<button class="answer" data-answer="${i}"><span class="answer-key">${i+1}</span><span>${esc(x.de)}</span></button>`).join('')}</div>`:round.mode==='cards'?`<button class="primary" id="reveal" data-action="reveal">Lösung aufdecken</button><div id="card-back" hidden><div class="card-solution">${esc(w.de)}</div><div class="write-controls"><button class="secondary" data-self="false">Noch üben</button><button class="primary" data-self="true">Gewusst ✓</button></div></div>`:inputMarkup()}<div id="feedback" class="feedback-slot" role="status" aria-live="polite"></div><button class="primary next wide" data-action="next" hidden>${round.index+1===total?'Runde abschließen':'Nächstes Wort →'}</button></section><p class="round-note">${persist?'':'Ohne Speichern · '}Kein Zeitlimit. Nimm dir Zeit zum Erinnern.</p></section>`;document.getElementById('question').focus({preventScroll:true});}
function feedbackHTML(right,value='',correction=false){const w=current(),solution=solutionText(w);return `<div class="feedback ${right?'good':'needs-work'}"><strong>${correction?(right?'✓ Jetzt stimmt es.':'Du kannst weiter korrigieren.'):(right?'✓ Richtig, gut gemacht!':'Dieses Wort üben wir noch einmal.')}</strong>${value?`<p>Deine Antwort: ${esc(value)}</p>`:''}<p class="solution-line">${round.mode==='sentence'?`<span lang="en">${esc(round.context.text.replace('___',solution))}</span>`:`<span ${round.mode==='reverse'?'':'lang="en"'}>${esc(round.mode==='reverse'?w.de:w.en)}</span> <span aria-hidden="true">→</span> <strong>${esc(solution)}</strong>`}</p>${correction?'<p class="small">Die Korrektur ändert die erste Wertung nicht. Der nächste unabhängige Abruf zählt wieder.</p>':!right?'<p class="small">Du kannst die Antwort korrigieren, erneut einsprechen oder weitergehen.</p>':''}${round.mode==='reverse'||round.mode==='sentence'?`<button class="audio-button" data-action="audio-solution" ${canSpeak()?'':'disabled'}>◖ Englische Lösung anhören</button>`:''}${!right&&round.mode!=='quiz'&&!round.skipped?'<button class="manual-answer" data-action="accept-written">Meine Übersetzung passt auch · selbst als richtig werten</button>':''}</div>`;}
function updateScore(){const el=document.getElementById('round-score');if(el&&round)el.textContent=round.right+' '+(round.mode==='cards'?'gewusst':'richtig');}
function settle(right,options={}){const w=current();if(right)round.right++;else round.missed.push(w);record(w,right,options);updateScore();}
function answer(index){if(!round||round.mode!=='quiz'||round.locked)return;const picked=round.options[index];if(!picked)return;round.locked=true;const w=current(),right=picked.id===w.id;round.writeRight=right;settle(right);for(const [i,b] of [...app.querySelectorAll('[data-answer]')].entries()){b.disabled=true;if(round.options[i].id===w.id){b.classList.add('correct');b.querySelector('.answer-key').textContent='✓';}else if(i===index){b.classList.add('wrong');b.querySelector('.answer-key').textContent='×';}}document.getElementById('feedback').innerHTML=feedbackHTML(right);showNext();}
function canEditWritten(){return !!round&&['write','reverse','sentence'].includes(round.mode)&&round.index<round.items.length&&(!round.locked||(!round.writeRight&&!round.correctionSolved));}
function writtenControls(disabled){const input=document.getElementById('written-answer');if(input){input.disabled=disabled;input.readOnly=false;}const check=document.getElementById('check-answer');if(check)check.disabled=disabled;const mic=document.getElementById('speech-button');if(mic)mic.disabled=disabled||!!speechUnavailable();}
function checkWritten(skipped=false){if(!canEditWritten()||(skipped&&round.locked))return;if(speech&&!skipped){setSpeechMessage('Beende zuerst die Aufnahme. Danach kannst du den Text prüfen.');return;}cancelSpeech();const input=document.getElementById('written-answer'),value=input.value.trim();if(!value&&!skipped){document.getElementById('feedback').textContent='Gib eine Antwort ein oder wähle „Weiß ich noch nicht“.';input.focus({preventScroll:true});return;}const right=!skipped&&isAccepted(current(),value);if(round.locked){round.correctionSolved=right;writtenControls(right);document.getElementById('feedback').innerHTML=feedbackHTML(right,value,true);if(right)showNext();else input.focus({preventScroll:true});return;}
round.locked=true;round.writeRight=right;round.correctionSolved=false;round.skipped=skipped;const old=activeRecords()[current().id];round.beforeRecord=old?{...old}:null;settle(right,{assisted:round.usedHint});writtenControls(right);document.getElementById('check-answer').textContent=right?'Antwort geprüft':'Korrektur prüfen';app.querySelector('[data-action="skip-write"]').disabled=true;document.getElementById('feedback').innerHTML=feedbackHTML(right,value);showNext(right);if(!right)input.focus({preventScroll:true});}
function acceptWritten(){if(!round||!round.locked||round.writeRight||round.correctionSolved||round.skipped||round.mode==='quiz')return;const w=current();if(round.beforeRecord)activeRecords()[w.id]={...round.beforeRecord};else delete activeRecords()[w.id];round.missed=round.missed.filter(x=>x.id!==w.id);round.right++;round.manual++;round.writeRight=true;record(w,true,{manual:true});updateScore();writtenControls(true);document.getElementById('feedback').innerHTML=`<div class="feedback good"><strong>Von dir als passend gewertet.</strong><p>Vergleiche sorgfältig mit: ${esc(solutionText())}</p><p class="small">Die Selbstwertung zählt für diese Runde, aber nicht als Bestätigung mit zeitlichem Abstand.</p></div>`;showNext();}
function showNext(focus=true){const b=app.querySelector('[data-action="next"]');b.hidden=false;if(focus)b.focus({preventScroll:true});}
function reveal(){if(!round||round.mode!=='cards'||round.revealed)return;round.revealed=true;document.getElementById('reveal').hidden=true;document.getElementById('card-back').hidden=false;app.querySelector('[data-self]').focus({preventScroll:true});}

function result(){if(!round||round.index<round.items.length)return home();const total=round.items.length,bad=round.missed.length,s=chapterStats();app.innerHTML=`${notice()}<section class="result-wrap"><section class="panel result"><span class="result-icon" aria-hidden="true">✓</span><p class="eyebrow">${esc(currentChapter().title)} · ${esc(LEVELS[round.mode].title)}</p><h1>Eine gute Runde<br>weiter<span class="accent">.</span></h1><p class="lead">${round.mode==='cards'?'Du hast dich bei':'Beim ersten Versuch waren'} <strong>${round.right} von ${total}</strong> ${round.mode==='cards'?'Karten sicher eingeschätzt.':'Antworten richtig.'}</p><div class="result-stats"><div><strong>${round.right}</strong><span>${round.mode==='cards'?'Gewusst':'Richtig'}</span></div><div><strong>${bad}</strong><span>Noch üben</span></div><div><strong>${s.retained}</strong><span>Mit Abstand bestätigt</span></div></div>${round.manual?`<p class="small">${round.manual} Antworten wurden selbst als passend gewertet.</p>`:''}<div class="result-actions">${bad?'<button class="primary" data-action="retry">Diese Wörter wiederholen →</button>':'<button class="primary" data-action="home">Zur Kapitelübersicht →</button>'}<button class="secondary" data-action="home">${bad?'Für heute fertig':'Andere Stufe wählen'}</button></div><p class="small">${persist?'Eine weitere Wiederholung nach einer Pause hilft beim Behalten.':'Dein Lernstand wird nicht gespeichert.'} Gute Arbeit – du bestimmst dein Tempo.</p></section>${bad?`<section class="panel missed"><h2>Diese Wörter schauen wir wieder an</h2>${listWords(round.missed)}</section>`:''}</section>`;}
function normalDE(value){return String(value).normalize('NFKC').toLocaleLowerCase('de').replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').replace(/[’'"„“.,!?;…()\/\-–—]/g,' ').replace(/\s+/g,' ').trim().replace(/^(der|die|das|ein|eine|einen|einem|einer|eines|den|dem|des)\s+/,'');}

const DE_ALIASES={

 'wash':['waschen','sich waschen'], 'neck':['Hals','Nacken'], 'hair':['Haar','Haare'],

 'brush':['putzen','bürsten'], 'tooth (plural: teeth)':['Zahn'], 'foot (plural: feet)':['Fuß'],

const EN_ALIASES={start:['beginning'],"brush one’s teeth":["brush one's teeth","brush my teeth","brush your teeth"],"hurry (up)":['hurry','hurry up'],"o’clock":["o'clock",'o clock'],"tooth (plural: teeth)":['tooth'],"foot (plural: feet)":['foot'],"you’ve got (= you have got)":["you've got","you have got"],"Mr":['Mr','Mister'],grey:['grey','gray'],grandpa:['grandpa','grandfather'],dad:['dad','daddy','father'],scary:['scary','frightening'],slim:['slim','slender'],guy:['guy','fellow'],"I wish it was Sunday!":['I wish it was Sunday','I wish it were Sunday']};
function englishAlternatives(w){return [englishPrompt(w),...(EN_ALIASES[w.en]||[])];}
function acceptedAnswers(w){if(round?.mode==='sentence')return new Set(round.context.answers.map(normalEN));if(round?.mode==='reverse'){const equivalent=WORDS.filter(x=>x.chapter===w.chapter&&normalDE(x.de)===normalDE(w.de));return new Set(equivalent.flatMap(englishAlternatives).map(normalEN));}const plain=w.de.replace(/\([^)]*\)/g,'').trim(),aliases=DE_ALIASES[w.en]||(w.s==='Sätze'?[]:plain.split(/[,;\/]/));return new Set([w.de,plain,...aliases].map(normalDE).filter(Boolean));}
function isAccepted(w,value){const n=round?.mode==='reverse'||round?.mode==='sentence'?normalEN:normalDE,v=n(value);return !!v&&acceptedAnswers(w).has(v);}
function canSpeak(){return !!(window.speechSynthesis&&window.SpeechSynthesisUtterance);}
function stopAudio(){try{window.speechSynthesis?.cancel();}catch(e){}tts=null;}
function say(text,lang='en-GB'){cancelSpeech();stopAudio();if(!canSpeak())return;try{const u=new window.SpeechSynthesisUtterance(text);u.lang=lang;u.rate=.88;const voices=window.speechSynthesis.getVoices()||[];u.voice=voices.find(v=>v.lang.toLowerCase()===lang.toLowerCase())||voices.find(v=>v.lang.toLowerCase().startsWith(lang.slice(0,2)))||null;tts=u;u.onerror=()=>{const el=document.getElementById('audio-status');if(el)el.textContent='Die Stimme konnte nicht geladen werden.';};window.speechSynthesis.speak(u);}catch(e){const el=document.getElementById('audio-status');if(el)el.textContent='Vorlesen ist gerade nicht möglich.';}}
function audioTask(){if(!round)return;if(round.mode==='reverse')say(current().de,'de-DE');else if(round.mode==='sentence')say(round.context.text.replace('___','blank'));else say(englishPrompt(current()));}
function audioSolution(){if(!round?.locked)return;say(round.mode==='sentence'?round.context.answers[0]:englishPrompt(current()));}
function speechConstructor(){return window.SpeechRecognition||window.webkitSpeechRecognition;}
function speechUnavailable(){if(window.isSecureContext===false)return 'Öffne das Spiel über seine HTTPS-Webadresse, um das Mikrofon zu nutzen.';if(!speechConstructor())return 'Spracheingabe ist in diesem Browser nicht verfügbar. Tippen oder die Mikrofontaste deiner Handy-Tastatur geht weiterhin.';return '';}
function speechMarkup(){const unavailable=speechUnavailable(),english=round.mode==='reverse'||round.mode==='sentence';return `<div class="speech-tools"><button id="speech-button" class="speech-button" type="button" data-action="speech" aria-pressed="false" aria-describedby="speech-status speech-privacy" ${unavailable?'disabled':''}>● Antwort sprechen</button><span class="small">${english?'Englisch':'Deutsch'}</span><p id="speech-status" role="status" aria-live="polite">${esc(unavailable||'Der erkannte Text erscheint im Feld und lässt sich korrigieren.')}</p><details id="speech-privacy"><summary>Mikrofon & Sprachdienst</summary><p>Das Mikrofon startet erst nach deinem Klick. Je nach Browser verarbeitet ein Online-Sprachdienst die Aufnahme. Diese Seite speichert keine Audioaufnahmen. ${english?'Beim Sprechen wird Wortschatz trainiert, keine selbst geschriebene Rechtschreibung.':''}</p></details></div>`;}
function setSpeechMessage(message){const el=document.getElementById('speech-status');if(el)el.textContent=message;}
function speechUI(busy,message){const b=document.getElementById('speech-button');if(!b)return;b.textContent=busy?'■ Aufnahme beenden':'● Antwort sprechen';b.setAttribute('aria-pressed',String(busy));b.classList.toggle('listening',busy);b.disabled=!canEditWritten()||!!speechUnavailable();const input=document.getElementById('written-answer');if(input)input.readOnly=busy;const check=document.getElementById('check-answer');if(check)check.disabled=busy||!canEditWritten();if(message)setSpeechMessage(message);}
function speechStillCurrent(s){return speech===s&&round===s.round&&canEditWritten()&&current().id===s.wordId&&document.getElementById('written-answer')===s.input;}
function finishSpeech(s,message,abort=false){if(speech!==s)return;speech=null;clearTimeout(s.timer);if(abort)try{s.recognition.abort();}catch(e){}if(document.getElementById('written-answer')===s.input)speechUI(false,message);}
function cancelSpeech(message='Aufnahme beendet. Du kannst tippen.'){if(speech)finishSpeech(speech,message,true);}
function speechErrorMessage(error){return {'not-allowed':'Mikrofon nicht freigegeben. Erlaube den Zugriff im Browser oder tippe.','service-not-allowed':'Der Sprachdienst ist hier nicht verfügbar. Tippe die Antwort.','audio-capture':'Kein Mikrofon verfügbar. Du kannst weiterhin tippen.','no-speech':'Keine Sprache erkannt. Versuche es erneut oder tippe.','network':'Der Sprachdienst ist nicht erreichbar. Prüfe die Verbindung oder tippe.','language-not-supported':'Diese Sprache wird hier nicht unterstützt. Du kannst tippen.','aborted':'Aufnahme beendet. Du kannst tippen.'}[error]||'Die Spracheingabe hat nicht geklappt. Versuche es erneut oder tippe.';}
function startSpeech(){if(!canEditWritten())return;if(speech){try{speech.recognition.stop();}catch(e){cancelSpeech();}return;}const unavailable=speechUnavailable();if(unavailable){setSpeechMessage(unavailable);return;}stopAudio();const input=document.getElementById('written-answer');let recognition;try{recognition=new (speechConstructor())();}catch(e){setSpeechMessage('Die Spracheingabe konnte nicht starten. Du kannst tippen.');return;}const s={recognition,input,round,wordId:current().id,timer:null};speech=s;recognition.lang=LEVELS[round.mode].language;recognition.continuous=false;recognition.interimResults=false;recognition.maxAlternatives=1;speechUI(true,'Mikrofon wird gestartet … Erlaube den Zugriff, wenn dein Browser danach fragt.');s.timer=setTimeout(()=>finishSpeech(s,'Die Spracheingabe hat zu lange gedauert. Versuche es erneut oder tippe.',true),30000);recognition.onstart=()=>{if(!speechStillCurrent(s)){try{recognition.abort();}catch(e){}return;}clearTimeout(s.timer);s.timer=setTimeout(()=>finishSpeech(s,'Aufnahme beendet. Du kannst es erneut versuchen oder tippen.',true),20000);setSpeechMessage('Ich höre zu … Antworte auf '+(recognition.lang==='de-DE'?'Deutsch.':'Englisch.'));};recognition.onresult=event=>{if(!speechStillCurrent(s))return;const parts=[];for(let i=event.resultIndex||0;i<event.results.length;i++){const r=event.results[i];if(r.isFinal!==false&&typeof r[0]?.transcript==='string')parts.push(r[0].transcript.trim());}const text=parts.join(' ').slice(0,500);if(!text)return;s.input.value=text;round.usedSpeech=true;finishSpeech(s,`Erkannt: „${text}“. Du kannst den Text korrigieren und dann prüfen.`,true);};recognition.onerror=e=>{if(speechStillCurrent(s))finishSpeech(s,speechErrorMessage(e.error),true);};recognition.onend=()=>{if(speechStillCurrent(s))finishSpeech(s,speechErrorMessage('no-speech'));};try{recognition.start();}catch(e){finishSpeech(s,e?.name==='NotAllowedError'?speechErrorMessage('not-allowed'):'Die Spracheingabe konnte nicht starten. Du kannst tippen.',true);}}
function render(){cancelSpeech();stopAudio();if(location.hash==='#kapitel'){selectedChapter=null;round=null;}updateHeader();if(location.hash==='#spielen'&&round&&round.index<round.items.length)play();else if(location.hash==='#ergebnis'&&round&&round.index>=round.items.length)result();else{round=null;selectedChapter?renderHome():renderChapters();}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.chapter){selectChapter(b.dataset.chapter);return;}if(b.dataset.quickChapter){quick(b.dataset.quickChapter);return;}if(b.dataset.mode){mode=b.dataset.mode;if(mode==='sentence'&&section==='Sätze')section='all';renderHome();app.querySelector(`[data-mode="${mode}"]`)?.focus({preventScroll:true});return;}if(b.dataset.section){section=b.dataset.section;renderHome(true);return;}if(b.dataset.length){length=b.dataset.length==='all'?'all':Number(b.dataset.length);renderHome(true);return;}if(b.hasAttribute('data-answer'))return answer(Number(b.dataset.answer));if(b.hasAttribute('data-self'))return selfAnswer(b.dataset.self==='true');switch(b.dataset.action){case'home':home();break;case'chapters':showChapters();break;case'quick':quick();break;case'start':start();break;case'review':start(difficult(),true);break;case'due':start(pool().filter(w=>isDue(activeRecords()[w.id])),true,true);break;case'next':next();break;case'reveal':reveal();break;case'retry':start([...round.missed],true);break;case'reset':resetProgress();break;case'speech':startSpeech();break;case'skip-write':checkWritten(true);break;case'accept-written':acceptWritten();break;case'audio-task':audioTask();break;case'audio-solution':audioSolution();break;}});
app.addEventListener('input',e=>{if(e.target.id==='search'){const q=e.target.value.trim().toLocaleLowerCase('de');document.getElementById('word-list').innerHTML=listWords(chapterWords().filter(w=>(w.en+' '+w.de).toLocaleLowerCase('de').includes(q)));}});
app.addEventListener('change',e=>{if(e.target.id==='save-progress')setPersistence(e.target.checked);});
app.addEventListener('submit',e=>{if(e.target.id==='write-form'){e.preventDefault();checkWritten();}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelSpeech();stopAudio();}});
window.addEventListener('pagehide',()=>{cancelSpeech();stopAudio();});
window.addEventListener('hashchange',render);
window.addEventListener('keydown',e=>{if(!round||location.hash!=='#spielen'||e.ctrlKey||e.metaKey||e.altKey||['INPUT','TEXTAREA','SELECT','BUTTON'].includes(document.activeElement?.tagName))return;if(round.mode==='quiz'&&!round.locked&&/^[1-4]$/.test(e.key)){e.preventDefault();answer(Number(e.key)-1);}});
render();

</script>
